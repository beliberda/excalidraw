name: Publish npm packages

# Собирает и публикует @excalidraw/* пакеты (common, fractional-indexing,
# laser-pointer, math, element, excalidraw) в npm-реестр Gitea при каждом
# пуше в master. Версия каждого пакета всегда получает суффикс с коротким
# SHA коммита — публикация никогда не конфликтует с уже выпущенной версией.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set package versions (short SHA suffix)
        run: node scripts/ci-set-versions.js "${GITHUB_SHA:0:8}"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build packages
        run: yarn build:packages

      - name: Configure npm registry auth
        run: |
          echo "@excalidraw:registry=https://gitea.bla-bla.tech/api/packages/gitea_blabla_admin/npm/" >> .npmrc
          echo "//gitea.bla-bla.tech/api/packages/gitea_blabla_admin/npm/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Publish packages
        run: |
          set -e
          for pkg in common fractional-indexing laser-pointer math element excalidraw; do
            echo "Publishing @excalidraw/$pkg..."
            (cd "packages/$pkg" && npm publish --registry https://gitea.bla-bla.tech/api/packages/gitea_blabla_admin/npm/)
          done

      # Gitea packages belong to the owner, not a repo, so the "Packages" tab
      # of this repo stays empty unless each package is explicitly linked to
      # it (cosmetic only — publishing/consuming the package doesn't need
      # it). The link only needs to happen once per package; Gitea has no
      # idempotent "link or no-op if already linked" response for this
      # endpoint (docs list only 201/404), so re-linking an already-linked
      # package on every later push errors. Never fail the job for this —
      # it's cosmetic, and the whole run turning red on every push after the
      # first obscures real publish failures.
      - name: Link packages to this repository
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"
          for pkg in common fractional-indexing laser-pointer math element excalidraw; do
            echo "Linking @excalidraw/$pkg to $repo_name..."
            http_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${NPM_TOKEN}" \
              "https://gitea.bla-bla.tech/api/v1/packages/gitea_blabla_admin/npm/%40excalidraw%2F$pkg/-/link/$repo_name")
            if [ "$http_code" = "201" ]; then
              echo "Linked @excalidraw/$pkg."
            else
              echo "Link request for @excalidraw/$pkg returned $http_code (likely already linked) — not failing the job, this step is cosmetic."
            fi
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
